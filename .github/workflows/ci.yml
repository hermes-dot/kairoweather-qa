name: QA CI

# 每次 push/PR 跑离线门禁；live 回归只在 Actions 页面手动触发。
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支连续提交时取消上一次，避免排队浪费免费额度。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + 覆盖率 + Allure
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      # setup-uv 会读取 pyproject.toml 的 requires-python，自动装 CPython 3.12。
      # enable-cache 缓存 uv 的 wheel 缓存；cache-dependency-glob 变化时自动失效。
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --frozen：锁文件与 pyproject 不一致就直接失败，防止 CI 悄悄解析出另一套依赖。
      - name: 安装依赖
        run: uv sync --frozen

      - name: 静态检查
        run: uv run ruff check .

      # 默认 addopts 已带 `-m "not live"`，这里不会再打真实接口、不烧配额。
      - name: 跑离线测试
        run: |
          mkdir -p reports
          uv run pytest -q \
            --cov \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --junitxml=reports/junit.xml \
            --alluredir=allure-results

      # 失败时报告才是第一现场，所以必须 if: always()。
      - name: 归档测试产物
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: qa-test-reports
          path: |
            coverage.xml
            htmlcov/
            allure-results/
            reports/junit.xml
          if-no-files-found: warn

  live:
    name: 真实接口回归（手动）
    # 只在 Actions 页面点 “Run workflow” 时执行；push/PR 不跑 live。
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 安装依赖
        run: uv sync --frozen

      - name: 检查密钥
        env:
          QWEATHER_API_KEY: ${{ secrets.QWEATHER_API_KEY }}
        run: |
          if [ -z "$QWEATHER_API_KEY" ]; then
            echo "::error::未配置仓库 Secret QWEATHER_API_KEY，live 回归无法执行"
            exit 1
          fi

      # 命令行 -m live 会覆盖 pyproject 里的默认 `-m "not live"`。
      - name: 跑真实接口回归
        env:
          QWEATHER_API_KEY: ${{ secrets.QWEATHER_API_KEY }}
          QWEATHER_API_BASE_URL: ${{ vars.QWEATHER_API_BASE_URL || 'https://devapi.qweather.com' }}
        run: uv run pytest -m live -q -rs
